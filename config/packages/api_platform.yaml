api_platform:
    title: 'WRA602 City Builder API'
    description: 'Backoffice API for the city-builder game (users, scores, cities, buildings).'
    version: '1.0.0'
    formats:
        json: ['application/json']
        jsonld: ['application/ld+json']
    docs_formats:
        jsonld: ['application/ld+json']
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
    use_symfony_listeners: true
